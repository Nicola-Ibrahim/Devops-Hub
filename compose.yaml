name: devops-hub

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    volumes: [control_plane_data:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: devops-hub-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: backend/.env
        required: false
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: [app]

  api:
    image: devops-hub-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8000/health/' + path, timeout=3) for path in ('ready', 'authorization')]"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles: [app]

  opa:
    image: openpolicyagent/opa:1.0.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: [./backend/src/identity/infra/authorization/policies:/policies:ro]
    networks: [control]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "--data", "/policies", "data.devops.identity.decision.policy_revision == \"identity-v1\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: [app]

  worker:
    image: devops-hub-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "devops_platform.infra.workers.resource_worker"]
    env_file:
      - path: backend/.env
        required: false
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    group_add: ["${PLATFORM_DOCKER_GID:-0}"]
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [resources]

  application-worker:
    image: devops-hub-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "devops_platform.infra.workers.application_worker"]
    env_file:
      - path: backend/.env
        required: false
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    group_add: ["${PLATFORM_DOCKER_GID:-0}"]
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [application-delivery]

  frontend:
    image: devops-hub-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - path: frontend/.env
        required: false
    ports: ["127.0.0.1:3000:3000"]
    networks: [control]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: [app]

networks:
  control:
    driver: bridge

volumes:
  control_plane_data:
