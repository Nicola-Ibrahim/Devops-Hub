[project]
name = "devops-hub-backend"
version = "0.1.0"
description = "Developer platform API and resource lifecycle foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "cryptography>=44,<52",
    "dishka>=1.6,<2",
    "docker>=7,<8",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "infra.http.asgi:app"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/identity",
    "src/developer_platform",
    "src/shared",
    "src/infra",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires an explicitly configured disposable PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true


# ====================================================================================
# Poe tasks
# ====================================================================================

[tool.poe.tasks.test]
cmd = "pytest"
help = "TEST: Run the test suite. Usage: poe test"

[tool.poe.tasks.test-cov]
cmd = "pytest --cov=src --cov-report=term-missing --cov-report=html"
help = "TEST COV: Run tests with coverage reporting. Usage: poe test-cov"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "LINT: Check for linting issues using ruff. Usage: poe lint"

[tool.poe.tasks.lint-fix]
cmd = "ruff check . --fix"
help = "LINT FIX: Automatically fix linting issues. Usage: poe lint-fix"

[tool.poe.tasks.format]
sequence = [
    { cmd = "ruff check . --select I --fix" },
    { cmd = "ruff format ." },
]
help = "FORMAT: Sort imports and format code. Usage: poe format"

[tool.poe.tasks.format-check]
cmd = "ruff format . --check"
help = "FORMAT CHECK: Check formatting without changing files. Usage: poe format-check"

[tool.poe.tasks.check]
sequence = ["lint", "format-check"]
ignore_fail = false
help = "CHECK: Run read-only linting and formatting checks. Usage: poe check"
