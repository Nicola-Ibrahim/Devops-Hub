name: Reusable Immutable Image Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Full ECR repository URL (without a tag).
        required: true
        type: string
      aws-region:
        description: AWS region containing the repository.
        required: true
        type: string
      aws-role-to-assume:
        description: Narrowly scoped GitHub OIDC publisher role.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path from repository root.
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      target:
        description: Optional multi-stage build target.
        required: false
        type: string
    outputs:
      digest:
        description: Published immutable image digest.
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.aws-role-to-assume != ''
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: image-publish-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build once and push immutable commit/run tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ inputs.image-name }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published digest
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image-name }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Record immutable reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published `${{ inputs.image-name }}@${IMAGE_DIGEST}`. Publishing does not deploy." >> "$GITHUB_STEP_SUMMARY"
