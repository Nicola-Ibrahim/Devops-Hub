---
- name: Infrastructure Lifecycle (Docker Compose - UP)
  command: "{{ playbook_dir }}/../../../scripts/ops/compose-up.sh"
  args:
    chdir: "{{ playbook_dir }}/../../.."
  register: compose_up
  changed_when: compose_up.rc == 0 and ('Started' in compose_up.stdout or 'Created' in compose_up.stdout)
  tags: [infrastructure]

- name: Backend Dependency Sync
  command: uv sync --frozen
  args:
    chdir: "{{ playbook_dir }}/../../../backend"
  register: uv_sync
  changed_when: "'Resolved' in uv_sync.stdout or 'Installed' in uv_sync.stdout"
  tags: [workspace]
