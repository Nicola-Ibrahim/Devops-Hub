---
- name: Install distribution Docker Engine and Compose plugin
  ansible.builtin.package:
    name:
      - docker.io
      - docker-compose-v2
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure Docker daemon starts on boot and is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
  when: ansible_os_family == "Debian"

- name: Verify Docker Compose plugin is available
  ansible.builtin.command: docker compose version
  changed_when: false
  when: ansible_os_family == "Debian"
