---
- name: Check if Docker is already in PATH
  command: which docker
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: "[Linux] Install Docker Engine"
  block:
    - name: "Install base prerequisites"
      package:
        name: [curl, ca-certificates]
        state: present
      become: true

    - name: "Install Docker via official script (Universal Linux)"
      shell: "curl -fsSL https://get.docker.com | sh"
      become: true
  when: 
    - ansible_system == "Linux"
    - docker_check.rc != 0
  tags: [setup, cloud]
