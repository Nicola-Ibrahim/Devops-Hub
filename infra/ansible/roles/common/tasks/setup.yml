---
- name: Update apt cache (Debian/Ubuntu)
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: true

- name: Install base utilities
  package:
    name:
      - curl
      - git
      - unzip
      - build-essential
    state: present
  become: true
  when: ansible_connection != 'local'

- name: Ensure 'infra' directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/opt/tob"
    - "/opt/tob/logs"
  become: true
  when: ansible_connection != 'local'
