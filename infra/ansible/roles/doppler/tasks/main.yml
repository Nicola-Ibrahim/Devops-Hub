---
- name: Execute Doppler Installation
  import_tasks: install.yml
  tags: [setup, tools]

- name: Configure Doppler Service Token (Servers)
  shell: "doppler configure set token {{ doppler_token }}"
  become: true
  when: 
    - ansible_system == "Linux"
    - doppler_token is defined
  tags: [setup, auth]

- name: Execute Doppler Secret Sync
  import_tasks: sync.yml
  tags: [setup, secrets]
