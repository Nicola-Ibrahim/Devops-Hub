---
- name: Download Doppler environment without exposing the response
  command: doppler secrets download --format env --no-file
  register: doppler_environment
  changed_when: false
  no_log: true
  when: doppler_enabled | default(false) | bool

- name: Write the optional Doppler environment with private permissions
  copy:
    content: "{{ doppler_environment.stdout }}\n"
    dest: "{{ app_root | default(playbook_dir + '/../../..') }}/.env"
    mode: '0600'
    owner: "{{ ansible_user_id }}"
  no_log: true
  when:
    - doppler_enabled | default(false) | bool
    - doppler_environment is defined
  tags: [optional-secrets]
