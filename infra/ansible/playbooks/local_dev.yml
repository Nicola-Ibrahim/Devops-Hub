---
- name: TOB Development Environment (Local)
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - { role: common, tags: [setup] }
    - { role: docker, tags: [setup, up] }
    - { role: doppler, tags: [setup, up, secrets] }
    - { role: workspace, tags: [setup, up, down] }
