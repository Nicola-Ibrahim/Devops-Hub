---
# macOS Setup
- name: "[macOS] Ensure Homebrew is installed"
  ansible.builtin.command: brew --version
  register: brew_check
  ignore_errors: true
  changed_when: false
  when: ansible_os_family == "Darwin"

- name: "[macOS] Install Developer Tools"
  community.general.homebrew:
    name: ["uv"]
    state: present
  when: 
    - ansible_os_family == "Darwin"
    - brew_check.rc == 0
  tags: [setup, tools]

- name: "[macOS] Install Docker Desktop"
  community.general.homebrew_cask:
    name: docker
    state: present
  when: 
    - ansible_os_family == "Darwin"
    - brew_check.rc == 0
  tags: [setup, docker]

# Linux Setup (Local)
- name: "[Linux] Install uv"
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: ~/.local/bin/uv
  when: ansible_system == "Linux"
  tags: [setup, uv]

- name: "[Linux] Install Docker (Local Engine)"
  ansible.builtin.package:
    name:
      - docker.io
      - docker-compose-v2
    state: present
  become: true
  when: ansible_system == "Linux"
  tags: [setup, docker]

- name: "[Linux] Ensure Docker is running"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
  when: ansible_system == "Linux"
  tags: [setup, docker]

# Windows Setup
- name: "[Windows] Install uv"
  win_shell: |
    powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
  when: ansible_os_family == "Windows"
  tags: [setup, uv]

- name: "[Windows] Install Docker Desktop via Winget"
  win_shell: winget install -e --id Docker.DockerDesktop
  when: ansible_os_family == "Windows"
  tags: [setup, docker]

# Shared Setup
- name: Check whether this checkout has a Git hooks directory
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../../.git/hooks"
  register: git_hooks_directory

- name: Install git pre-commit hook
  ansible.builtin.template:
    src: pre-commit.sh.j2
    dest: "{{ playbook_dir }}/../../../../.git/hooks/pre-commit"
    mode: '0755'
  when: git_hooks_directory.stat.isdir | default(false)
  tags: [setup, hooks]
