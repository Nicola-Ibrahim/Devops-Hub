[project]
name = "platform-dev"
version = "0.1.0"
description = "Tracing Objectives Backwards - Platform Development Toolbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.16.0",
]

[project.scripts]
tob-bootstrap = "platform_dev.bootstrap:run_bootstrap"
tob-dev = "platform_dev.dev:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_dev*"]
