name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version to use'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Directory to run commands in'
        required: false
        type: string
        default: '.'
      package-manager:
        description: 'Package manager to use (pnpm, npm, yarn)'
        required: false
        type: string
        default: 'npm'
      run-lint:
        description: 'Whether to run linting'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to run tests'
        required: false
        type: boolean
        default: true
      pnpm-version:
        description: 'pnpm version (optional, if omitted uses package.json)'
        required: false
        type: string
        default: ''
      package-json-file:
        description: 'Path to package.json (optional)'
        required: false
        type: string
        default: 'package.json'
      lockfile:
        description: 'Lockfile path relative to working-directory'
        required: false
        type: string
        default: 'package-lock.json'



jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.package-json-file }}



      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.lockfile }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm lint
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn lint
          else
            npm run lint
          fi

      - name: Run Tests
        if: ${{ inputs.run-test }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm test
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn test
          else
            npm run test
          fi
