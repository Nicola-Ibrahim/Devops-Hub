name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
      working-directory:
        description: 'Directory to run commands in'
        required: false
        type: string
        default: 'backend'
      lint-paths:
        description: 'Space-separated paths checked by Ruff; paths are treated as literal arguments'
        required: false
        type: string
        default: 'src migrations tests'
      run-lint:
        description: 'Whether to run linting'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to run tests'
        required: false
        type: boolean
        default: true
      environment:
        description: 'The environment to set (e.g., development, production)'
        required: false
        type: string
        default: 'test'


jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.8.6"
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Set up Python ${{ inputs.python-version }}
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ inputs.python-version }}

      - name: Run Lint (Ruff)
        if: ${{ inputs.run-lint }}
        env:
          LINT_PATHS: ${{ inputs.lint-paths }}
        run: |
          read -r -a lint_paths <<< "$LINT_PATHS"
          uv run --frozen ruff check "${lint_paths[@]}"
          uv run --frozen ruff format --check "${lint_paths[@]}"

      - name: Run Tests (Pytest)
        if: ${{ inputs.run-test }}
        run: uv run --frozen pytest -q
