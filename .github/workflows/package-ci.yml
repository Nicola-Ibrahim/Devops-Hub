name: "Package CI"

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with ruff
        run: |
          uv pip install ruff
          uv run ruff check .

      - name: Verify Build
        run: uv build
