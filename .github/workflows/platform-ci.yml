name: Platform CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".dockerignore"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".dockerignore"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: devops_hub_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d devops_hub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/devops_hub_test
      PLATFORM_TEST_DOCKER_URL: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.6"
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.12
      - name: Lint and format
        run: |
          uv run --frozen ruff check src migrations tests
          uv run --frozen ruff format --check src migrations tests
      - run: uv run --frozen mypy src
      - name: Render approved FastAPI acceptance application
        run: |
          uv run --frozen python - <<'PYTHON'
          import os
          from pathlib import Path
          from devops_platform.infra.templates.catalog import FilesystemTemplateCatalog
          target = Path(os.environ["RUNNER_TEMP"]) / "generated-fastapi"
          catalog = FilesystemTemplateCatalog(
              Path("src/devops_platform/infra/templates/catalogs"),
          )
          for item in catalog.render("python-fastapi", "1.0.0", {"application_name": "ci-demo"}):
              path = target / item.path
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(item.content)
          PYTHON
      - name: Verify generated FastAPI project
        working-directory: ${{ runner.temp }}/generated-fastapi
        run: |
          uv sync --frozen --python 3.12
          uv run --frozen ruff check app tests
          uv run --frozen ruff format --check app tests
          uv run --frozen pytest -q
      - name: Prepare isolated lifecycle images
        working-directory: .
        run: |
          docker pull postgres:16
          docker build -t devops-hub/generated-fastapi:ci "$RUNNER_TEMP/generated-fastapi"
      - name: Unit, PostgreSQL and Docker lifecycle integration checks
        env:
          PLATFORM_TEST_APPLICATION_IMAGE: devops-hub/generated-fastapi:ci
        run: uv run --frozen pytest -q
      - run: uv build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and declared collections
        run: |
          python -m pip install --disable-pip-version-check 'ansible-core==2.18.2'
          ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Check playbook syntax
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
        run: |
          ansible-playbook -i infra/ansible/inventory/local.yml infra/ansible/playbooks/bootstrap-local.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory/local.yml infra/ansible/playbooks/setup.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory/production.yml infra/ansible/playbooks/deploy.yml --syntax-check
      - name: Validate Compose model with isolated placeholder files
        run: |
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          for name in postgres_password platform_database_url platform_token_pepper platform_installation_id platform_resource_encryption_key platform_resource_key_id platform_metrics_token; do
            printf 'ci-placeholder\n' > "$secret_dir/$name"
          done
          PLATFORM_SECRETS_DIR="$secret_dir" docker compose --profile app config --quiet

  packaged-images:
    if: github.ref != 'refs/heads/main' || vars.AWS_PUBLISH_ROLE_ARN == ''
    runs-on: ubuntu-latest
    needs: [backend, dashboard, infrastructure]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build API image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: devops-hub-api:ci
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: devops-hub-frontend:ci
