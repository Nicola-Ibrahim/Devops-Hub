name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: Exact API image reference from Publish Platform Images (repository@sha256:digest).
        required: true
        type: string
      frontend_image:
        description: Exact frontend image reference from Publish Platform Images (repository@sha256:digest).
        required: true
        type: string
      schema_compatible:
        description: Confirm migrations are expand/contract compatible with the currently deployed application image.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: devops-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      PLATFORM_INSTANCE_ID: ${{ vars.PLATFORM_INSTANCE_ID }}
      API_IMAGE: ${{ inputs.api_image }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      SCHEMA_COMPATIBLE: ${{ inputs.schema_compatible }}
    steps:
      - name: Validate release digest and migration safety confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_REGION" && -n "$AWS_ROLE_TO_ASSUME" && -n "$AWS_ECR_REPOSITORY" && -n "$PLATFORM_INSTANCE_ID" ]]
          [[ "$PLATFORM_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          [[ "$API_IMAGE" == "$AWS_ECR_REPOSITORY"@sha256:* ]]
          [[ "$FRONTEND_IMAGE" == "$AWS_ECR_REPOSITORY"@sha256:* ]]
          [[ "$API_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$SCHEMA_COMPATIBLE" == "true" ]] || { echo 'Deployment blocked: schema compatibility confirmation is required.' >&2; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: platform-deploy-${{ github.run_id }}
      - name: Dispatch digest-only release through SSM
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          command_text="AWS_REGION=${AWS_REGION} /opt/devops-hub/scripts/ops/release.sh '${API_IMAGE}' '${FRONTEND_IMAGE}' true"
          jq -n --arg command "$command_text" '{commands: [$command]}' > "$RUNNER_TEMP/ssm-parameters.json"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$PLATFORM_INSTANCE_ID" \
            --comment "DevOps Hub release ${GITHUB_SHA}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM release command accepted: $command_id"
      - name: Wait for host readiness and rollback result
        env:
          COMMAND_ID: ${{ steps.dispatch.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          status="Pending"
          for attempt in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PLATFORM_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) echo "Host release and readiness checks succeeded."; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Host release failed with SSM status: $status. Check the protected host runbook and release log." >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
          echo "Timed out waiting for SSM release status; inspect command $COMMAND_ID before retrying." >&2
          exit 1
