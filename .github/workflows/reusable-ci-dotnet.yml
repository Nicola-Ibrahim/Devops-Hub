name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
      dotnet-version:
        type: string
        default: '10.0.x'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore src/App.csproj
      - run: dotnet build src/App.csproj --no-restore --configuration Release
      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/App.csproj --no-build --configuration Release --urls http://127.0.0.1:8080 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
